spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
  ai:

    dashscope:
      api-key: ${DASHSCOPE_API_KEY}  # 你的阿里云百炼 API Key
      embedding:
        enabled: true
        options:
          model: text-embedding-v2  # 阿里云 Embedding 模型

    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7            # 0-2，越高越有创意

  datasource:
    url: jdbc:mysql://localhost:3306/knowheart?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

# KnowHeart 自定义配置
knowheart:
  chat:
    memory:
      retrieve-size: 10
  rag:
    top-k: 6
    similarity-threshold: 0.0   # 0=不过滤，取 topK 内结果（中文语义检索分数常偏低）
    chunk-size: 500
    chunk-overlap: 100
  vector:
    table-name: love_knowledge
    dimensions: 1536   # text-embedding-v2 向量维度
    datasource:
      url: jdbc:postgresql://localhost:5432/knowheart_vector
      username: postgres
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver

amap:
  api:
    key: ${AMAP_API_KEY}
